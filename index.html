<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Gallery</title><link rel="stylesheet" href="image.css">
</head>
<body>
<header><h1>My Image Gallery</h1><p>Explore beautiful moments</p></header>
<div class="filters"><button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="nature">Nature</button><button class="filter-btn" data-filter="city">City</button><button class="filter-btn" data-filter="animals">Animals</button></div>
<main class="gallery">
<div class="gallery-item" data-category="nature"><img src="images/mountain.svg" alt="Mountain"><div class="overlay"><h3>Mountain</h3><p>Nature</p></div></div>
<div class="gallery-item" data-category="city"><img src="images/city.svg" alt="City Lights"><div class="overlay"><h3>City Lights</h3><p>City</p></div></div>
<div class="gallery-item" data-category="animals"><img src="images/elephant.svg" alt="Elephant"><div class="overlay"><h3>Elephant</h3><p>Animals</p></div></div>
<div class="gallery-item" data-category="nature"><img src="images/forest.svg" alt="Forest"><div class="overlay"><h3>Forest</h3><p>Nature</p></div></div>
<div class="gallery-item" data-category="city"><img src="images/street.svg" alt="City Street"><div class="overlay"><h3>City Street</h3><p>City</p></div></div>
<div class="gallery-item" data-category="animals"><img src="images/lion.svg" alt="Lion"><div class="overlay"><h3>Lion</h3><p>Animals</p></div></div>
<div class="gallery-item" data-category="nature"><img src="images/beach.svg" alt="Beach"><div class="overlay"><h3>Beach</h3><p>Nature</p></div></div>
<div class="gallery-item" data-category="city"><img src="images/buildings.svg" alt="Modern Buildings"><div class="overlay"><h3>Modern City</h3><p>City</p></div></div>
</main>
<div class="lightbox" id="lightbox"><button class="close" id="close">&times;</button><button class="prev" id="prev">&#10094;</button><div class="lightbox-content"><img id="lightbox-img" src="" alt=""><h2 id="lightbox-title"></h2><p id="lightbox-category"></p></div><button class="next" id="next">&#10095;</button></div>
<script src="image.js"></script>
</body></html>
